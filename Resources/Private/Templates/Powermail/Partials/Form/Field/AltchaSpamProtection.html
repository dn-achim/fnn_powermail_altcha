{namespace pa=Fnn\FnnPowermailAltcha\ViewHelpers}

<f:asset.script identifier="powermailAltcha" src="EXT:fnn_powermail_altcha/Resources/Public/JavaScript/altcha.i18n.min.js" defer="true" async="true" type="module" />

<f:variable name="altchaConfig" value="{pa:altchaSpamProtection(settings: settings)}" />

<div class="powermail_fieldwrap powermail_fieldwrap_type_altcha powermail_fieldwrap_{field.marker} {field.css} {settings.styles.framework.fieldAndLabelWrappingClasses}">
    <div class="{settings.styles.framework.fieldWrappingClasses}">
        <f:if condition="{altchaConfig.hmacKey} == 'error'">
            <f:then>
                <f:render partial="AltchaSpamProtectionError" arguments="{message: 'No HMAC Key found. Please check TypoScript configuration'}"></f:render>
            </f:then>
            <f:else>
                <altcha-widget
                        challenge="{altchaConfig.altchaChallenge -> f:format.json()}"
                        configuration="{altchaConfig.widgetConfiguration -> f:format.json()}"
                        name="tx_powermail_pi1[field][{field.marker}]"
                        id="tx_powermail_pi1[field][{field.marker}]_widget"
                        <f:if condition="{altchaConfig.langLabels}">data-altcha-i18n="{altchaConfig.langLabels -> f:format.json()}"</f:if>
                        data-powermail-error-container=".powermail_field_error_container_{field.marker}"
                        auto="{altchaConfig.configuration.validation}"
                        data-lifetime="{altchaConfig.lifetime}"></altcha-widget>
            </f:else>
        </f:if>
    </div>
    <div class="powermail_field_error_container powermail_field_error_container_{field.marker}"></div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('altcha-widget').forEach(function(widget) {
            widget.addEventListener('load', function(event) {
                widget.querySelectorAll('input[type="checkbox"]').forEach(function(checkbox) {
                    checkbox.setAttribute('name', checkbox.id || 'altcha-checkbox-' + + Math.floor(Math.random() * 90000 + 10000));
                    checkbox.setAttribute('data-powermail-errors-container', widget.getAttribute('data-powermail-error-container'))
                });
            });
        });
    });
</script>
<f:if condition="{altchaConfig.langLabels}">
<script>
    // Widget v3 has no `strings` attribute anymore. Labels configured in TypoScript are merged
    // into the widget's i18n store for the language the widget resolves (same resolution as the widget).
    customElements.whenDefined('altcha-widget').then(function() {
        var i18n = globalThis.$altcha.i18n;
        var locales;
        i18n.store.subscribe(function(value) { locales = value; })();
        var codes = Object.keys(locales);
        document.querySelectorAll('altcha-widget[data-altcha-i18n]').forEach(function(widget) {
            var candidates = [widget.getAttribute('language'), document.documentElement.lang].concat(Array.from(navigator.languages));
            var locale = null;
            candidates.forEach(function(candidate) {
                if (locale || !candidate) {
                    return;
                }
                candidate = candidate.toLowerCase();
                locale = locales[candidate] ? candidate : (codes.find(function(code) {
                    return candidate.split('-')[0] === code.split('-')[0];
                }) || null);
            });
            locale = locale && locales[locale] ? locale : 'en';
            i18n.set(locale, Object.assign({}, locales[locale], JSON.parse(widget.getAttribute('data-altcha-i18n'))));
        });
    });
</script>
</f:if>
